name: Mouse fix test APK

on:
  push:
    branches: [fix/x11-pointer-grab-press]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out GameNative
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest
      - name: Build test APK
        run: ./gradlew :app:assembleLegacyDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-mouse-fix-legacy-debug
          path: app/build/outputs/apk/legacy/debug/app-legacy-debug.apk
          if-no-files-found: error
